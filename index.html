<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Soccer 3D</title>

<style>
  #game{
position:absolute;
inset:0;
z-index:0;
}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b10;font-family:Arial;color:white}
#game{width:100vw;height:100vh;display:block}
#menu,#panel{
position:absolute;inset:0;display:flex;flex-direction:column;
justify-content:center;align-items:center;
background:linear-gradient(135deg,#07101c,#111827);
}
#panel{display:none}
h1{font-size:60px;margin:0 0 35px;text-shadow:0 0 25px #00bfff}
h2{font-size:40px}
button,select{
width:290px;padding:15px;margin:6px;border:0;border-radius:10px;
background:#1b2b40;color:white;font-size:18px;font-weight:bold
}
button:hover{background:#29425f}
#hud{
display:none;position:absolute;top:15px;left:50%;
transform:translateX(-50%);text-align:center;z-index:5;
pointer-events:none
}
#score{font-size:40px;font-weight:bold}
#timer{font-size:23px}
#pause{
display:none;position:absolute;right:15px;top:15px;
width:100px;padding:10px;z-index:8
}
#boost{
display:none;position:absolute;bottom:25px;left:25px;
width:230px;height:22px;border:2px solid white;
background:#111;z-index:5
}
#boostFill{height:100%;background:#ffd21c;width:100%}
#boostText{
position:absolute;bottom:51px;left:25px;font-weight:bold
}
#end{
display:none;position:absolute;inset:0;
background:rgba(0,0,0,.72);z-index:20;
flex-direction:column;justify-content:center;align-items:center;
text-align:center
}
.small{opacity:.7;margin-top:12px}
</style>
</head>

<body>

<div id="menu">
<h1>CAR SOCCER 3D</h1>
<button onclick="openBot()">PLAY VS BOT</button>
<button onclick="startTraining()">🏋️ TRAINING</button>
<button onclick="openCars()">🚗 CHANGE CAR</button>
<button onclick="openOptions()">⚙️ OPTIONS</button>
<div class="small">WASD • SPACE BOOST • Air Roll • Camera Toggle</div>
</div>

<div id="panel">
<h2 id="panelTitle">MENU</h2>
<div id="panelContent"></div>
<button onclick="backMenu()">BACK</button>
</div>

<div id="hud">
<div id="score">0 - 0</div>
<div id="timer">5:00</div>
</div>

<button id="pause" onclick="togglePause()">PAUSE</button>

<div id="boost">
<div id="boostFill"></div>
</div>
<div id="boostText">BOOST 100</div>

<div id="end">
<h1 id="endText">YOU WIN!</h1>
<button onclick="backMenu()">MAIN MENU</button>
</div>

<canvas id="game"></canvas>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
THREE.JS SETUP
========================= */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
canvas,
antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07101a);

const camera=new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
.1,
300
);

camera.position.set(0,8,12);

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

/* LIGHT */

scene.add(new THREE.HemisphereLight(0xffffff,0x31512f,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,30,10);
sun.castShadow=true;
scene.add(sun);

/* =========================
GAME VARIABLES
========================= */

let mode="menu";
let paused=false;

let timeLeft=300;
let playerScore=0;
let botScore=0;

let selectedCar="Octane";

let keys={};

let bindings={
forward:"w",
backward:"s",
left:"a",
right:"d",
boost:" ",
reset:"r",
airLeft:"q",
airRight:"e",
camera:"c"
};

let cameraToggle=true;

const carColors={
Octane:0xff6b00,
Dominus:0xe63939,
Fennec:0xffc400,
Merc:0x9b59ff
};

/* =========================
CONTROLS
========================= */

document.addEventListener("keydown",e=>{
let k=e.key.toLowerCase();

if(k===" ")e.preventDefault();

keys[k]=true;

if(k===bindings.reset &&
(mode==="game"||mode==="training")){
resetPositions();
}

if(k===bindings.camera){
cameraToggle=!cameraToggle;
}
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

/* =========================
ARENA
========================= */

const FIELD_W=50;
const FIELD_L=90;

function createArena(){

const floor=new THREE.Mesh(
new THREE.BoxGeometry(FIELD_W,.5,FIELD_L),
new THREE.MeshStandardMaterial({color:0x16783b})
);

floor.position.y=-.25;
floor.receiveShadow=true;
scene.add(floor);

/* Center line */

const lineMat=new THREE.MeshBasicMaterial({
color:0xffffff
});

const line=new THREE.Mesh(
new THREE.BoxGeometry(.15,.03,FIELD_L),
lineMat
);

line.position.y=.02;
scene.add(line);

/* Center circle */

const ring=new THREE.Mesh(
new THREE.RingGeometry(7.9,8,.5,64),
new THREE.MeshBasicMaterial({
color:0xffffff,
side:THREE.DoubleSide
})
);

ring.rotation.x=-Math.PI/2;
ring.position.y=.03;
scene.add(ring);

/* Walls */

const wallMat=new THREE.MeshStandardMaterial({
color:0x12314a,
transparent:true,
opacity:.75
});

const back1=new THREE.Mesh(
new THREE.BoxGeometry(FIELD_W,5,.7),wallMat
);
back1.position.set(0,2.5,-FIELD_L/2);
scene.add(back1);

const back2=back1.clone();
back2.position.z=FIELD_L/2;
scene.add(back2);

const side1=new THREE.Mesh(
new THREE.BoxGeometry(.7,5,FIELD_L),
wallMat
);
side1.position.set(-FIELD_W/2,2.5,0);
scene.add(side1);

const side2=side1.clone();
side2.position.x=FIELD_W/2;
scene.add(side2);

/* Goals */

const goalMat1=new THREE.MeshStandardMaterial({
color:0x2255dd,
transparent:true,
opacity:.55
});

const goalMat2=new THREE.MeshStandardMaterial({
color:0xdd4422,
transparent:true,
opacity:.55
});

const goal1=new THREE.Mesh(
new THREE.BoxGeometry(14,4,6),goalMat1
);
goal1.position.set(0,2,-FIELD_L/2-3);
scene.add(goal1);

const goal2=goal1.clone();
goal2.material=goalMat2;
goal2.position.z=FIELD_L/2+3;
scene.add(goal2);
}

createArena();

/* =========================
BOOST PADS
========================= */

let pads=[];

function createBoostPad(x,z,big){

const mesh=new THREE.Mesh(
new THREE.CylinderGeometry(
big?1.6:.75,
big?1.6:.75,
.15,
32
),
new THREE.MeshStandardMaterial({
color:big?0xffa600:0xffdf3d,
emissive:big?0x884400:0x665500
})
);

mesh.position.set(x,.1,z);
scene.add(mesh);

pads.push({
mesh,
x,z,
big,
amount:big?100:12,
cooldown:0
});
}

for(let x of [-17,0,17]){
createBoostPad(x,-25,false);
createBoostPad(x,25,false);
}

createBoostPad(-22,-38,true);
createBoostPad(22,-38,true);
createBoostPad(-22,38,true);
createBoostPad(22,38,true);

/* =========================
CAR CREATION
========================= */

function createCar(type){

const group=new THREE.Group();

const mat=new THREE.MeshStandardMaterial({
color:carColors[type],
metalness:.25,
roughness:.45
});

const body=new THREE.Mesh(
new THREE.BoxGeometry(3.2,1,5),
mat
);

body.position.y=1;
body.castShadow=true;
group.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(2.4,.8,2),
new THREE.MeshStandardMaterial({
color:0x111827,
metalness:.2
})
);

cabin.position.set(0,1.65,-.2);
cabin.castShadow=true;
group.add(cabin);

const wheelMat=new THREE.MeshStandardMaterial({
color:0x101010
});

for(let x of [-1.45,1.45]){
for(let z of [-1.65,1.65]){

const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.55,.55,.45,20),
wheelMat
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(x,.55,z);
wheel.castShadow=true;

group.add(wheel);
}
}

return group;
}

const player=createCar(selectedCar);
scene.add(player);

const bot=createCar("Dominus");
scene.add(bot);

/* =========================
BALL
========================= */

const ball=new THREE.Mesh(
new THREE.SphereGeometry(1,32,32),
new THREE.MeshStandardMaterial({
color:0xffffff,
roughness:.25
})
);

ball.castShadow=true;
scene.add(ball);

let ballVel=new THREE.Vector3();

/* =========================
PHYSICS
========================= */

let playerVel=new THREE.Vector3();
let botVel=new THREE.Vector3();

function resetPositions(){

player.position.set(0,1,30);
player.rotation.set(0,Math.PI,0);

bot.position.set(0,1,-30);
bot.rotation.set(0,0,0);

ball.position.set(0,1,0);
ballVel.set(0,0,0);

playerVel.set(0,0,0);
botVel.set(0,0,0);
}

function driveCar(car,vel,dt,isPlayer){

let forward=0;

if(isPlayer){

if(keys[bindings.forward])forward=1;
if(keys[bindings.backward])forward=-.65;

if(keys[bindings.left])
car.rotation.y+=3*dt;

if(keys[bindings.right])
car.rotation.y-=3*dt;

if(keys[bindings.airLeft])
car.rotation.z+=4*dt;

if(keys[bindings.airRight])
car.rotation.z-=4*dt;

}else{

const target=ball.position.clone();
target.y=1;

const dx=target.x-car.position.x;
const dz=target.z-car.position.z;

const wanted=Math.atan2(dx,dz);
let diff=wanted-car.rotation.y;

while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;

car.rotation.y+=Math.max(-2.5*dt,
Math.min(2.5*dt,diff));

forward=1;
}

const speed=isPlayer?35:25;

if(forward){

const dir=new THREE.Vector3(
Math.sin(car.rotation.y),
0,
Math.cos(car.rotation.y)
);

vel.add(dir.multiplyScalar(
speed*forward*dt
));
}

if(isPlayer &&
keys[bindings.boost] &&
playerBoost>0){

const dir=new THREE.Vector3(
Math.sin(car.rotation.y),
0,
Math.cos(car.rotation.y)
);

vel.add(dir.multiplyScalar(55*dt));
playerBoost-=35*dt;
}else if(isPlayer){

playerBoost+=12*dt;
}

if(isPlayer)
playerBoost=Math.max(0,Math.min(100,playerBoost));

vel.multiplyScalar(.97);

const max=isPlayer?42:30;

if(vel.length()>max)
vel.setLength(max);

car.position.addScaledVector(vel,dt);

car.position.x=Math.max(-FIELD_W/2+2,
Math.min(FIELD_W/2-2,car.position.x));

car.position.z=Math.max(-FIELD_L/2+2,
Math.min(FIELD_L/2-2,car.position.z));

car.position.y=1;
}

/* =========================
BALL
========================= */

function updateBall(dt){

ball.position.addScaledVector(ballVel,dt);

ballVel.multiplyScalar(.992);

if(ball.position.x<-FIELD_W/2+1){
ball.position.x=-FIELD_W/2+1;
ballVel.x=Math.abs(ballVel.x);
}

if(ball.position.x>FIELD_W/2-1){
ball.position.x=FIELD_W/2-1;
ballVel.x=-Math.abs(ballVel.x);
}

/* Side walls */

if(ball.position.z<-FIELD_L/2){

if(Math.abs(ball.position.x)<7){

playerScore++;
resetPositions();
return;

}else{

ball.position.z=-FIELD_L/2;
ballVel.z=Math.abs(ballVel.z);
}
}

if(ball.position.z>FIELD_L/2){

if(Math.abs(ball.position.x)<7){

botScore++;
resetPositions();
return;

}else{

ball.position.z=FIELD_L/2;
ballVel.z=-Math.abs(ballVel.z);
}
}

collide(player,playerVel);

if(mode==="game")
collide(bot,botVel);

collectBoost(player);

}

function collide(car,vel){

const dx=ball.position.x-car.position.x;
const dz=ball.position.z-car.position.z;

const dist=Math.hypot(dx,dz);

if(dist<4){

const nx=dx/(dist||1);
const nz=dz/(dist||1);

ball.position.x=car.position.x+nx*4;
ball.position.z=car.position.z+nz*4;

ballVel.x=nx*28+vel.x*.5;
ballVel.z=nz*28+vel.z*.5;
}
}

/* =========================
BOOST
========================= */

let playerBoost=100;

function collectBoost(car){

for(const p of pads){

if(p.cooldown>0){
p.cooldown-=.016;
continue;
}

const d=Math.hypot(
car.position.x-p.x,
car.position.z-p.z
);

if(d<3){

playerBoost=Math.min(
100,
playerBoost+p.amount
);

p.cooldown=p.big?8:3;
p.mesh.visible=false;

setTimeout(()=>{
p.mesh.visible=true;
},(p.big?8000:3000));
}
}
}

/* =========================
CAMERA
========================= */

function updateCamera(){

if(!cameraToggle){

camera.position.set(
player.position.x,
player.position.y+30,
player.position.z
);

camera.lookAt(player.position);
return;
}

const offset=new THREE.Vector3(
0,7,-13
);

offset.applyAxisAngle(
new THREE.Vector3(0,1,0),
player.rotation.y
);

const target=player.position.clone().add(offset);

camera.position.lerp(target,.12);

const look=player.position.clone();
look.y+=1;

camera.lookAt(look);
}

/* =========================
UI
========================= */

function hideMenus(){
document.getElementById("menu").style.display="none";
document.getElementById("panel").style.display="none";
}

function openBot(){

document.getElementById("menu").style.display="none";

const panel=document.getElementById("panel");
panel.style.display="flex";

document.getElementById("panelTitle").textContent=
"CHOOSE BOT";

document.getElementById("panelContent").innerHTML=`

<select id="difficulty">
<option>Bronze</option>
<option>Silver</option>
<option>Gold</option>
<option>Platinum</option>
<option>Diamond</option>
<option>Champion</option>
<option>Grand Champion</option>
<option>Supersonic Legend</option>
</select>

<button onclick="startBot()">START MATCH</button>
`;
}

function openCars(){

document.getElementById("menu").style.display="none";

const panel=document.getElementById("panel");
panel.style.display="flex";

document.getElementById("panelTitle").textContent=
"CHOOSE CAR";

document.getElementById("panelContent").innerHTML=`

<button onclick="selectCar('Octane')">OCTANE</button>
<button onclick="selectCar('Dominus')">DOMINUS</button>
<button onclick="selectCar('Fennec')">FENNEC</button>
<button onclick="selectCar('Merc')">MERC</button>
`;
}

function openOptions(){

document.getElementById("menu").style.display="none";

const panel=document.getElementById("panel");
panel.style.display="flex";

document.getElementById("panelTitle").textContent=
"CONTROLS";

document.getElementById("panelContent").innerHTML=`

${bindButton("forward","Forward")}
${bindButton("backward","Backward")}
${bindButton("left","Left")}
${bindButton("right","Right")}
${bindButton("boost","Boost")}
${bindButton("reset","Reset")}
${bindButton("airLeft","Air Roll Left")}
${bindButton("airRight","Air Roll Right")}
${bindButton("camera","Camera Toggle")}

<button onclick="resetBindings()">
RESET CONTROLS
</button>
`;
}

function bindButton(id,name){

let value=bindings[id];

if(value===" ")value="SPACE";

return `
<button onclick="changeBinding('${id}')">
${name}: ${value.toUpperCase()}
</button>
`;
}

function changeBinding(id){

const key=prompt(
"Press the new key for "+id+
"\\nPress SPACE for spacebar."
);

if(key===null||key==="")return;

bindings[id]=key===" "?" ":key.toLowerCase();

openOptions();
}

function resetBindings(){

bindings={
forward:"w",
backward:"s",
left:"a",
right:"d",
boost:" ",
reset:"r",
airLeft:"q",
airRight:"e",
camera:"c"
};

openOptions();
}

function selectCar(type){

selectedCar=type;

scene.remove(player);

player=createCar(selectedCar);

scene.add(player);

backMenu();
}

function startBot(){

mode="game";
timeLeft=300;
playerScore=0;
botScore=0;
paused=false;

hideMenus();

document.getElementById("hud").style.display="block";
document.getElementById("pause").style.display="block";
document.getElementById("boost").style.display="block";

resetPositions();
}

function startTraining(){

mode="training";
timeLeft=Infinity;
playerScore=0;
botScore=0;
paused=false;

hideMenus();

document.getElementById("hud").style.display="block";
document.getElementById("pause").style.display="block";
document.getElementById("boost").style.display="block";

document.getElementById("timer").textContent="TRAINING";

resetPositions();
}

function backMenu(){

mode="menu";
paused=false;

document.getElementById("menu").style.display="flex";
document.getElementById("panel").style.display="none";
document.getElementById("hud").style.display="none";
document.getElementById("pause").style.display="none";
document.getElementById("boost").style.display="none";
document.getElementById("end").style.display="none";
}

function togglePause(){

paused=!paused;

document.getElementById("pause").textContent=
paused?"RESUME":"PAUSE";
}

/* =========================
GAME LOOP
========================= */

let last=performance.now();

function loop(now){

requestAnimationFrame(loop);

const dt=Math.min(
(now-last)/1000,
.033
);

last=now;

if(mode==="game"||mode==="training"){

if(!paused){

if(mode==="game"){

timeLeft-=dt;

if(timeLeft<=0){

timeLeft=0;
endGame();
}
}

if(mode!=="finished"){

driveCar(
player,
playerVel,
dt,
true
);

if(mode==="game"){

driveCar(
bot,
botVel,
dt,
false
);
}

updateBall(dt);
updateCamera();

updateHUD();
updateBoost();
}
}
}

renderer.render(scene,camera);
}

function updateHUD(){

document.getElementById("score").textContent=
playerScore+" - "+botScore;

if(mode==="training"){

document.getElementById("timer").textContent=
"TRAINING";

return;
}

let m=Math.floor(timeLeft/60);
let s=Math.floor(timeLeft%60);

document.getElementById("timer").textContent=
m+":"+(s<10?"0":"")+s;
}

function updateBoost(){

document.getElementById("boostFill").style.width=
playerBoost+"%";

document.getElementById("boostText").textContent=
"BOOST "+Math.round(playerBoost);
}

function endGame(){

if(mode==="finished")return;

mode="finished";
paused=true;

let text="DRAW!";

if(playerScore>botScore)
text="YOU WIN 🏆";

if(playerScore<botScore)
text="BOT WINS";

document.getElementById("endText").innerHTML=
text+
"<br><span style='font-size:25px'>"+
playerScore+" - "+botScore+
"</span>";

document.getElementById("end").style.display="flex";
document.getElementById("pause").style.display="none";
}

/* START */

resetPositions();
requestAnimationFrame(loop);

</script>

</body>
</html>
