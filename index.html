<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Soccer 3D</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#071018;
font-family:Arial,sans-serif;
color:white;
touch-action:none;
}

#game{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
}

.ui{
position:fixed;
inset:0;
z-index:50;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
}

.panel{
width:min(92vw,520px);
max-height:90vh;
overflow:auto;
background:rgba(7,13,21,.96);
border:1px solid rgba(255,255,255,.2);
border-radius:22px;
padding:25px;
text-align:center;
box-shadow:0 20px 70px #000b;
}

h1{font-size:42px;margin:0 0 5px}
h2{margin:0 0 15px}
.sub{opacity:.65;margin-bottom:20px}

button,select{
width:100%;
padding:14px;
margin:6px 0;
border:0;
border-radius:12px;
background:#1c2a3a;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
touch-action:manipulation;
}

button.primary{background:#1976ff}
button:hover{filter:brightness(1.15)}

.hidden{display:none!important}

.setting{
text-align:left;
margin:8px 0;
}

.setting label{
display:block;
font-size:13px;
opacity:.7;
margin-bottom:4px;
}

.key{
background:#101b27;
border:1px solid #3b4e62;
}

#hud{
position:fixed;
z-index:15;
top:12px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:10px;
pointer-events:none;
}

.hud{
background:rgba(0,0,0,.6);
border-radius:12px;
padding:8px 15px;
font-weight:bold;
font-size:22px;
}

#pauseBtn{
position:fixed;
z-index:16;
top:12px;
right:12px;
width:auto;
margin:0;
}

#boostBar{
position:fixed;
z-index:15;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:230px;
height:14px;
background:#111a22;
border:1px solid #555;
border-radius:10px;
overflow:hidden;
pointer-events:none;
}

#boostFill{
width:100%;
height:100%;
background:#ffd21c;
}

#touch{
position:fixed;
z-index:15;
left:10px;
right:10px;
bottom:10px;
display:flex;
justify-content:space-between;
pointer-events:none;
}

.touchSide{
display:flex;
gap:8px;
align-items:flex-end;
}

.touchBtn{
width:58px;
height:58px;
padding:0;
margin:0;
border-radius:50%;
background:rgba(18,29,42,.85);
border:1px solid rgba(255,255,255,.25);
pointer-events:auto;
font-size:20px;
user-select:none;
}

.touchBtn.big{
width:72px;
height:72px;
}

@media(max-width:600px){
h1{font-size:34px}
.panel{padding:20px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
<div class="hud" id="score">0 - 0</div>
<div class="hud" id="timer">5:00</div>
</div>

<button id="pauseBtn" class="hidden">Ⅱ</button>

<div id="boostBar" class="hidden">
<div id="boostFill"></div>
</div>

<div id="touch" class="hidden">

<div class="touchSide">
<button class="touchBtn" id="leftTouch">◀</button>
<button class="touchBtn" id="rightTouch">▶</button>
</div>

<div class="touchSide">
<button class="touchBtn big" id="jumpTouch">⬆</button>
<button class="touchBtn big" id="boostTouch">⚡</button>
</div>

</div>

<!-- MAIN MENU -->

<div id="menu" class="ui">
<div class="panel">

<h1>CAR SOCCER</h1>
<div class="sub">3D ARENA</div>

<div id="mainButtons">

<button id="playBot" class="primary">
PLAY VS BOT
</button>

<button id="training">
TRAINING
</button>

<button id="cars">
CHANGE CAR
</button>

<button id="options">
OPTIONS
</button>

</div>

<div id="botPanel" class="hidden">

<h2>BOT DIFFICULTY</h2>

<select id="difficulty">
<option>Bronze</option>
<option>Silver</option>
<option>Gold</option>
<option>Platinum</option>
<option>Diamond</option>
<option>Champion</option>
<option>Grand Champion</option>
<option>Supersonic Legend</option>
</select>

<button id="startBot" class="primary">
START MATCH
</button>

<button class="back">
BACK
</button>

</div>

<div id="carPanel" class="hidden">

<h2>CHOOSE CAR</h2>

<select id="carSelect">
<option>Octane</option>
<option>Dominus</option>
<option>Fennec</option>
<option>Merc</option>
</select>

<button id="selectCar" class="primary">
SELECT
</button>

<button class="back">
BACK
</button>

</div>

<div id="settingsPanel" class="hidden">

<h2>SETTINGS</h2>

<div class="setting">
<label>Forward</label>
<button class="key" data-key="forward"></button>
</div>

<div class="setting">
<label>Backward</label>
<button class="key" data-key="backward"></button>
</div>

<div class="setting">
<label>Turn Left</label>
<button class="key" data-key="left"></button>
</div>

<div class="setting">
<label>Turn Right</label>
<button class="key" data-key="right"></button>
</div>

<div class="setting">
<label>Boost</label>
<button class="key" data-key="boost"></button>
</div>

<div class="setting">
<label>Jump / Double Jump / Dodge</label>
<button class="key" data-key="jump"></button>
</div>

<div class="setting">
<label>Air Roll Left</label>
<button class="key" data-key="airLeft"></button>
</div>

<div class="setting">
<label>Air Roll Right</label>
<button class="key" data-key="airRight"></button>
</div>

<div class="setting">
<label>Camera Toggle</label>
<button class="key" data-key="camera"></button>
</div>

<div class="setting">
<label>Reset Car</label>
<button class="key" data-key="reset"></button>
</div>

<button id="resetControls">
RESET CONTROLS
</button>

<button class="back">
BACK
</button>

</div>

</div>
</div>

<!-- PAUSE -->

<div id="pause" class="ui hidden">

<div class="panel">

<h1>PAUSED</h1>

<button id="resume" class="primary">
RESUME
</button>

<button id="quit">
QUIT
</button>

</div>

</div>

<!-- END -->

<div id="end" class="ui hidden">

<div class="panel">

<h1 id="endTitle">GAME OVER</h1>

<div class="sub" id="endScore"></div>

<button id="again" class="primary">
PLAY AGAIN
</button>

<button id="endMenu">
MAIN MENU
</button>

</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ================================
THREE.JS
================================ */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
canvas:canvas,
antialias:true
});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled=true;

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x07121c);

const camera=
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
.1,
500
);

camera.position.set(
0,
7,
-12
);

const clock=new THREE.Clock();

/* LIGHT */

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x24405a,
2.2
)
);

const sun=
new THREE.DirectionalLight(
0xffffff,
2.5
);

sun.position.set(
-20,
30,
-10
);

sun.castShadow=true;

scene.add(sun);

/* ================================
ARENA
================================ */

const FIELD_W=48;
const FIELD_L=78;

const SIDE=FIELD_W/2;
const END=FIELD_L/2;

const CORNER=7;

const green=
new THREE.MeshStandardMaterial({
color:0x176b39,
roughness:.85
});

/* floor */

const floor=
new THREE.Mesh(
new THREE.BoxGeometry(
FIELD_W,
.5,
FIELD_L
),
green
);

floor.position.y=-.25;
floor.receiveShadow=true;

scene.add(floor);

/* rounded corner visual strips */

const wallMat=
new THREE.MeshStandardMaterial({
color:0x142838,
roughness:.55
});

function curvedCorner(
cx,
cz,
start,
end
){

const points=[];

for(
let i=0;
i<=20;
i++
){

const a=
start+
(end-start)*i/20;

points.push(
new THREE.Vector3(
cx+
CORNER*Math.cos(a),
2,
cz+
CORNER*Math.sin(a)
)
);
}

const curve=
new THREE.CatmullRomCurve3(
points
);

const tube=
new THREE.Mesh(
new THREE.TubeGeometry(
curve,
25,
1.5,
8,
false
),
wallMat
);

scene.add(tube);
}

/* corners */

curvedCorner(
-SIDE+CORNER,
-END+CORNER,
Math.PI,
Math.PI*1.5
);

curvedCorner(
SIDE-CORNER,
-END+CORNER,
Math.PI*1.5,
Math.PI*2
);

curvedCorner(
SIDE-CORNER,
END-CORNER,
0,
Math.PI*.5
);

curvedCorner(
-SIDE+CORNER,
END-CORNER,
Math.PI*.5,
Math.PI
);

/* walls */

function makeWall(
x,
z,
w,
d
){

const wall=
new THREE.Mesh(
new THREE.BoxGeometry(
w,
4,
d
),
wallMat
);

wall.position.set(
x,
2,
z
);

wall.castShadow=true;

scene.add(wall);
}

makeWall(
-SIDE,
0,
.7,
FIELD_L-14
);

makeWall(
SIDE,
0,
.7,
FIELD_L-14
);

makeWall(
0,
-END,
FIELD_W-14,
.7
);

makeWall(
0,
END,
FIELD_W-14,
.7
);

/* field markings */

const white=
new THREE.MeshBasicMaterial({
color:0xffffff
});

const centerLine=
new THREE.Mesh(
new THREE.BoxGeometry(
FIELD_W-2,
.05,
.12
),
white
);

centerLine.position.y=.04;

scene.add(centerLine);

const centerCircle=
new THREE.Mesh(
new THREE.RingGeometry(
6,
6.15,
64
),
white
);

centerCircle.rotation.x=
-Math.PI/2;

centerCircle.position.y=.05;

scene.add(centerCircle);

/* ================================
GOALS
================================ */

const GOAL_WIDTH=17;
const GOAL_DEPTH=6;

function makeGoal(
z,
blue
){

const group=
new THREE.Group();

const mat=
new THREE.MeshStandardMaterial({
color:
blue?
0x2188ff:
0xff4828,
transparent:true,
opacity:.38
});

const back=
new THREE.Mesh(
new THREE.BoxGeometry(
GOAL_WIDTH,
6,
.5
),
mat
);

back.position.set(
0,
3,
z
);

group.add(back);

const postL=
new THREE.Mesh(
new THREE.BoxGeometry(
.5,
6,
GOAL_DEPTH
),
mat
);

postL.position.set(
-GOAL_WIDTH/2,
3,
z+(z<0?3:-3)
);

group.add(postL);

const postR=postL.clone();

postR.position.x=
GOAL_WIDTH/2;

group.add(postR);

scene.add(group);
}

makeGoal(
-END,
true
);

makeGoal(
END,
false
);

/* ================================
BOOST PADS
================================ */

const pads=[];

function addPad(
x,
z,
big=false
){

const mesh=
new THREE.Mesh(
new THREE.CylinderGeometry(
big?1.35:.65,
big?1.35:.65,
.16,
32
),
new THREE.MeshStandardMaterial({
color:
big?
0xffa500:
0xffd52d,
emissive:
big?
0x754000:
0x593900,
emissiveIntensity:1
})
);

mesh.position.set(
x,
.12,
z
);

scene.add(mesh);

pads.push({
mesh,
x,
z,
big,
active:true,
cooldown:0
});
}

/* lots of small pads */

for(
const z of
[-30,-20,-10,0,10,20,30]
){

addPad(-18,z);
addPad(18,z);
}

/* big pads */

addPad(
-SIDE+3,
-END+3,
true
);

addPad(
SIDE-3,
-END+3,
true
);

addPad(
-SIDE+3,
END-3,
true
);

addPad(
SIDE-3,
END-3,
true
);

/* ================================
BALL
================================ */

const ball=
new THREE.Mesh(
new THREE.SphereGeometry(
1.05,
32,
20
),
new THREE.MeshStandardMaterial({
color:0xffffff,
roughness:.3
})
);

ball.castShadow=true;

scene.add(ball);

const ballVel=
new THREE.Vector3();

/* ================================
CAR
================================ */

const carColors={
Octane:0xff542f,
Dominus:0xff3030,
Fennec:0xff8b22,
Merc:0xc94cff
};

function makeCar(
name,
color
){

const group=
new THREE.Group();

let width=2.3;
let length=3.7;
let height=1.05;

if(name==="Dominus"){
length=4.3;
height=.8;
}

if(name==="Fennec"){
width=2.4;
length=3.5;
height=1.25;
}

if(name==="Merc"){
width=2.7;
length=3.5;
height=1.55;
}

const body=
new THREE.Mesh(
new THREE.BoxGeometry(
width,
height,
length
),
new THREE.MeshStandardMaterial({
color,
roughness:.4
})
);

body.position.y=1;

body.castShadow=true;

group.add(body);

const glass=
new THREE.Mesh(
new THREE.BoxGeometry(
width*.7,
height*.45,
length*.4
),
new THREE.MeshStandardMaterial({
color:0x111a21,
roughness:.2
})
);

glass.position.set(
0,
1.55,
-.1
);

group.add(glass);

for(
const x of
[-width*.48,width*.48]
){

for(
const z of
[-length*.3,length*.3]
){

const wheel=
new THREE.Mesh(
new THREE.CylinderGeometry(
.43,
.43,
.34,
20
),
new THREE.MeshStandardMaterial({
color:0x101010
})
);

wheel.rotation.z=
Math.PI/2;

wheel.position.set(
x,
.55,
z
);

group.add(wheel);
}
}

return group;
}

let selectedCar="Octane";

let player=
makeCar(
selectedCar,
carColors[selectedCar]
);

scene.add(player);

let bot=
makeCar(
"Octane",
0x2388ff
);

scene.add(bot);

/* ================================
PLAYER STATE
================================ */

const playerState={
velocity:new THREE.Vector3(),
verticalVelocity:0,
boost:100,
grounded:true,
jumps:0,
dodging:false
};

const botState={
velocity:new THREE.Vector3()
};

let scorePlayer=0;
let scoreBot=0;

let gameTime=300;

let running=false;
let training=false;
let paused=false;

let cameraMode=0;

/* ================================
CONTROLS
================================ */

const controls={
forward:"KeyW",
backward:"KeyS",
left:"KeyA",
right:"KeyD",
boost:"Space",
jump:"ShiftLeft",
airLeft:"KeyQ",
airRight:"KeyE",
camera:"KeyC",
reset:"KeyR"
};

const keys={};

let binding=null;

const keyNames={
Space:"SPACE",
ShiftLeft:"SHIFT",
ShiftRight:"SHIFT",
ControlLeft:"CTRL",
AltLeft:"ALT",
ArrowUp:"↑",
ArrowDown:"↓",
ArrowLeft:"←",
ArrowRight:"→"
};

function prettyKey(k){
return keyNames[k] ||
k
.replace("Key","")
.replace("Digit","");
}

function refreshControls(){

document
.querySelectorAll("[data-key]")
.forEach(button=>{

const name=
button.dataset.key;

button.textContent=
prettyKey(
controls[name]
);

});
}

refreshControls();

document
.querySelectorAll("[data-key]")
.forEach(button=>{

button.addEventListener(
"click",
e=>{

e.preventDefault();
e.stopPropagation();

binding=
button.dataset.key;

button.textContent=
"PRESS KEY...";

}
);

});

window.addEventListener(
"keydown",
e=>{

if(binding){

e.preventDefault();

controls[binding]=
e.code;

binding=null;

refreshControls();

return;
}

keys[e.code]=true;

if(
e.code===
controls.jump
){
jump();
}

if(
e.code===
controls.camera
){
cameraMode=
cameraMode?0:1;
}

if(
e.code===
controls.reset
){
resetPlayer();
}

}
);

window.addEventListener(
"keyup",
e=>{
keys[e.code]=false;
}
);

/* ================================
JUMP / DODGE
================================ */

function jump(){

if(
!running ||
paused
) return;

if(
playerState.grounded
){

playerState.grounded=false;
playerState.jumps=1;
playerState.verticalVelocity=10;

return;
}

if(
playerState.jumps===1
){

/*
SECOND JUMP:
launches the car forward
instead of only upward.
*/

playerState.jumps=2;

const forward=
new THREE.Vector3(
Math.sin(player.rotation.y),
0,
Math.cos(player.rotation.y)
);

playerState.velocity.add(
forward.multiplyScalar(13)
);

playerState.verticalVelocity=7;

playerState.dodging=true;

setTimeout(()=>{
playerState.dodging=false;
},260);
}
}

/* ================================
RESET
================================ */

function resetPlayer(){

player.position.set(
0,
0,
-22
);

player.rotation.set(
0,
0,
0
);

playerState.velocity.set(
0,
0,
0
);

playerState.verticalVelocity=0;

playerState.grounded=true;
playerState.jumps=0;
}

/* ================================
BALL RESET
================================ */

function resetBall(){

ball.position.set(
0,
1,
0
);

ballVel.set(
0,
0,
0
);
}

/* ================================
PLAYER PHYSICS
================================ */

function updatePlayer(dt){

const forward=
keys[controls.forward];

const backward=
keys[controls.backward];

const left=
keys[controls.left];

const right=
keys[controls.right];

const boosting=
keys[controls.boost] &&
playerState.boost>0 &&
forward;

let throttle=0;

if(forward)throttle=1;
if(backward)throttle=-1;

const acceleration=
playerState.grounded?
32:
9;

playerState.velocity.z +=
throttle*
acceleration*
dt;

const maxSpeed=
boosting?
28:
17;

const horizontalSpeed=
Math.sqrt(
playerState.velocity.x**2+
playerState.velocity.z**2
);

if(horizontalSpeed>maxSpeed){

const scale=
maxSpeed/
horizontalSpeed;

playerState.velocity.x*=scale;
playerState.velocity.z*=scale;
}

/* braking/friction */

const friction=
playerState.grounded?
.88:
.995;

playerState.velocity.x*=
Math.pow(friction,dt*60);

playerState.velocity.z*=
Math.pow(friction,dt*60);

/* steering */

let steer=0;

if(left)steer=1;
if(right)steer=-1;

const speedFactor=
Math.min(
1,
horizontalSpeed/5
);

player.rotation.y +=
steer*
2.7*
dt*
(.35+speedFactor);

/* convert forward movement */

const forwardVector=
new THREE.Vector3(
Math.sin(player.rotation.y),
0,
Math.cos(player.rotation.y)
);

const currentForward=
playerState.velocity.dot(
forwardVector
);

const sideways=
playerState.velocity.clone()
.sub(
forwardVector.clone()
.multiplyScalar(currentForward)
);

playerState.velocity
.sub(
sideways.multiplyScalar(
playerState.grounded?
.22:
.015
)
);

if(
boosting
){

playerState.velocity.add(
forwardVector
.multiplyScalar(
38*dt
)
);

playerState.boost=
Math.max(
0,
playerState.boost-
35*dt
);

}else{

playerState.boost=
Math.min(
100,
playerState.boost+
6*dt
);
}

/* move */

player.position.add(
playerState.velocity
.clone()
.multiplyScalar(dt)
);

/* air physics */

if(
!playerState.grounded
){

playerState.verticalVelocity -=
25*dt;

player.position.y +=
playerState.verticalVelocity*
dt;

/* air roll */

if(
keys[controls.airLeft]
){
player.rotation.z +=
4*dt;
}

if(
keys[controls.airRight]
){
player.rotation.z -=
4*dt;
}

/* aerial steering */

if(keys[controls.left]){
player.rotation.y+=1.5*dt;
}

if(keys[controls.right]){
player.rotation.y-=1.5*dt;
}

if(
player.position.y<=0
){

player.position.y=0;

playerState.verticalVelocity=0;

playerState.grounded=true;

playerState.jumps=0;

player.rotation.z*=.65;
}

}

/* field limits */

player.position.x=
THREE.MathUtils.clamp(
player.position.x,
-SIDE+1.5,
SIDE-1.5
);

player.position.z=
THREE.MathUtils.clamp(
player.position.z,
-END+1.5,
END-1.5
);
}

/* ================================
BOT
================================ */

const difficulties={
Bronze:{speed:7,reaction:.6},
Silver:{speed:8,reaction:.7},
Gold:{speed:9,reaction:.78},
Platinum:{speed:10,reaction:.84},
Diamond:{speed:11,reaction:.89},
Champion:{speed:12,reaction:.93},
"Grand Champion":{speed:13,reaction:.97},
"Supersonic Legend":{speed:15,reaction:1}
};

let botDifficulty=
difficulties.Bronze;

function updateBot(dt){

if(training)return;

const dx=
ball.position.x-
bot.position.x;

const dz=
ball.position.z-
bot.position.z;

const targetAngle=
Math.atan2(
dx,
dz
);

let difference=
targetAngle-
bot.rotation.y;

while(
difference>Math.PI
)difference-=Math.PI*2;

while(
difference<-Math.PI
)difference+=Math.PI*2;

bot.rotation.y +=
THREE.MathUtils.clamp(
difference,
-botDifficulty.reaction*3*dt,
botDifficulty.reaction*3*dt
);

const forward=
new THREE.Vector3(
Math.sin(bot.rotation.y),
0,
Math.cos(bot.rotation.y)
);

botState.velocity.add(
forward.clone()
.multiplyScalar(
botDifficulty.speed*
3*
dt
)
);

const speed=
botState.velocity.length();

if(
speed>
botDifficulty.speed
){
botState.velocity
.setLength(
botDifficulty.speed
);
}

botState.velocity.multiplyScalar(
Math.pow(.88,dt*60)
);

bot.position.add(
botState.velocity
.clone()
.multiplyScalar(dt)
);

bot.position.x=
THREE.MathUtils.clamp(
bot.position.x,
-SIDE+2,
SIDE-2
);

bot.position.z=
THREE.MathUtils.clamp(
bot.position.z,
2,
END-3
);
}

/* ================================
BALL PHYSICS
================================ */

function collideBall(car,state){

const dx=
ball.position.x-
car.position.x;

const dz=
ball.position.z-
car.position.z;

const dy=
ball.position.y-
(car.position.y+1);

const distance=
Math.sqrt(
dx*dx+
dz*dz+
dy*dy
);

if(distance<2.35){

let nx=dx;
let ny=dy;
let nz=dz;

if(distance<.01){

nx=0;
ny=0;
nz=1;

}else{

nx/=distance;
ny/=distance;
nz/=distance;

}

ball.position.x=
car.position.x+
nx*2.35;

ball.position.y=
car.position.y+
1+
ny*2.35;

ball.position.z=
car.position.z+
nz*2.35;

const carSpeed=
state.velocity.length();

const force=
10+
carSpeed*1.1;

ballVel.x +=
nx*force;

ballVel.y +=
ny*force+
(car.position.y>1?4:0);

ballVel.z +=
nz*force;
}
}

function updateBall(dt){

/* gravity */

ballVel.y -=
22*dt;

ball.position.add(
ballVel.clone()
.multiplyScalar(dt)
);

/* floor */

if(
ball.position.y<1
){

ball.position.y=1;

if(ballVel.y<0)
ballVel.y*=-.55;

if(
Math.abs(ballVel.y)<.7
){
ballVel.y=0;
}
}

/* friction */

ballVel.x*=
Math.pow(.992,dt*60);

ballVel.z*=
Math.pow(.992,dt*60);

/*
SIDE WALLS:
bounce instead of scoring.
*/

if(
ball.position.x<
-SIDE+1
){

ball.position.x=
-SIDE+1;

ballVel.x=
Math.abs(ballVel.x)*.82;
}

if(
ball.position.x>
SIDE-1
){

ball.position.x=
SIDE-1;

ballVel.x=
-Math.abs(ballVel.x)*.82;
}

/*
BACK WALL:
only score if ball is inside
the actual goal opening.
*/

if(
ball.position.z<
-END+1
){

if(
Math.abs(ball.position.x)<
GOAL_WIDTH/2
){

scoreBot++;

updateScore();

resetBall();

}else{

ball.position.z=
-END+1;

ballVel.z=
Math.abs(ballVel.z)*.82;
}
}

if(
ball.position.z>
END-1
){

if(
Math.abs(ball.position.x)<
GOAL_WIDTH/2
){

scorePlayer++;

updateScore();

resetBall();

}else{

ball.position.z=
END-1;

ballVel.z=
-Math.abs(ballVel.z)*.82;
}
}

collideBall(
player,
playerState
);

collideBall(
bot,
botState
);
}

/* ================================
BOOST
================================ */

function updatePads(dt){

for(
const pad of pads
){

if(!pad.active){

pad.cooldown-=dt;

if(
pad.cooldown<=0
){

pad.active=true;

pad.mesh.visible=true;
}

continue;
}

const dx=
player.position.x-
pad.x;

const dz=
player.position.z-
pad.z;

const radius=
pad.big?
2:
1.1;

if(
dx*dx+
dz*dz<
radius*radius
){

if(pad.big){

playerState.boost=100;

pad.cooldown=10;

}else{

playerState.boost=
Math.min(
100,
playerState.boost+12
);

pad.cooldown=4;
}

pad.active=false;

pad.mesh.visible=false;
}
}
}

/* ================================
CAMERA
================================ */

function updateCamera(dt){

if(cameraMode===0){

const behind=
new THREE.Vector3(
0,
6.8,
-11
);

behind.applyAxisAngle(
new THREE.Vector3(0,1,0),
player.rotation.y
);

const desired=
player.position.clone()
.add(behind);

camera.position.lerp(
desired,
1-Math.pow(.001,dt)
);

const look=
player.position.clone();

look.y+=1;

camera.lookAt(look);

}else{

const desired=
new THREE.Vector3(
0,
38,
0
);

camera.position.lerp(
desired,
1-Math.pow(.001,dt)
);

camera.lookAt(
0,
0,
0
);
}
}
